<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Highway - Anime Ninja ZX-10R Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            touch-action: none;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            overflow: hidden;
            border: 4px solid #38bdf8;
            background: #0f172a;
        }

        .game-wrapper {
            position: relative;
            background: #2e8b57;
        }

        canvas {
            display: block;
            background: #2e8b57;
        }

        /* HUD (Score, Lives & Speedometer) */
        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }

        .hud-box {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .hud-box span {
            color: #38bdf8;
        }

        /* কন্ট্রোল প্যানেল */
        .control-panel {
            width: 100%;
            background: #0f172a;
            display: flex;
            justify-content: space-between;
            padding: 15px 25px;
            border-top: 2px solid #38bdf8;
        }

        .control-group {
            display: flex;
            gap: 15px;
        }

        .touch-btn {
            width: 65px;
            height: 65px;
            background: rgba(56, 189, 248, 0.25);
            border: 2px solid #38bdf8;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .touch-btn:active {
            background: rgba(56, 189, 248, 0.6);
            transform: scale(0.92);
        }

        /* Start & Game Over Screen */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        .overlay h1 {
            font-size: 38px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .overlay p {
            color: #cbd5e1;
            margin-bottom: 20px;
            font-size: 15px;
            line-height: 1.5;
        }

        button {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.4);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-wrapper">
        <div class="hud">
            <div class="hud-box">SCORE: <span id="scoreDisplay">0</span></div>
            <div class="hud-box" id="livesDisplay">❤️❤️❤️</div>
            <div class="hud-box">SPEED: <span id="speedDisplay">0</span> KM/H</div>
        </div>

        <div id="startScreen" class="overlay">
            <h1>Ninja Highway</h1>
            <p>Anime Kawasaki Ninja বাইক নিয়ে ৪ লেনের হাইওয়েতে ছুটুন এবং স্পোর্টস কার ট্রাফিক এড়িয়ে চলুন!</p>
            <button onclick="startGame()">START RIDE</button>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h1 style="color: #f43f5e;">CRASHED!</h1>
            <p id="finalScoreText" style="font-size: 20px; font-weight: bold; margin-bottom: 20px;">Score: 0</p>
            <button onclick="startGame()">PLAY AGAIN</button>
        </div>

        <canvas id="gameCanvas" width="480" height="440"></canvas>
    </div>

    <!-- কন্ট্রোল প্যানেল (বাম, ডান, ব্রেক, রেস) -->
    <div class="control-panel">
        <div class="control-group">
            <div class="touch-btn" id="leftBtn">◀</div>
            <div class="touch-btn" id="rightBtn">▶</div>
        </div>
        <div class="control-group">
            <div class="touch-btn" id="brakeBtn" style="background: rgba(239, 68, 68, 0.25); border-color: #ef4444;">▼</div>
            <div class="touch-btn" id="accelBtn" style="background: rgba(34, 197, 94, 0.25); border-color: #22c55e;">▲</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreDisplay = document.getElementById('scoreDisplay');
    const speedDisplay = document.getElementById('speedDisplay');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreText = document.getElementById('finalScoreText');
    const livesDisplay = document.getElementById('livesDisplay');

    let isGameRunning = false;
    let score = 0;
    let lives = 3;
    let roadOffset = 0;
    let animationId;

    // ৪ লেনের চাপা রাস্তা সেটআপ
    const roadX = 100;
    const roadWidth = 280;
    const laneCount = 4;
    const laneWidth = roadWidth / laneCount;

    // প্লেয়ার নিঞ্জা বাইক
    const player = {
        x: canvas.width / 2 - 16,
        y: canvas.height - 100,
        width: 32,
        height: 85,
        speed: 0,
        maxSpeed: 20,
        acceleration: 0.3,
        friction: 0.08,
        brakePower: 0.5,
        vx: 0,
        turnSpeed: 0.75,
        turnFriction: 0.85,
        angle: 0
    };

    const keys = { up: false, down: false, left: false, right: false };

    function bindButton(id, keyName) {
        const btn = document.getElementById(id);
        if(!btn) return;
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
        btn.addEventListener('mousedown', (e) => { e.preventDefault(); keys[keyName] = true; });
        btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[keyName] = false; });
    }

    bindButton('leftBtn', 'left');
    bindButton('rightBtn', 'right');
    bindButton('accelBtn', 'up');
    bindButton('brakeBtn', 'down');

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') keys.up = true;
        if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') keys.down = true;
        if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = true;
        if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') keys.up = false;
        if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') keys.down = false;
        if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
        if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
    });

    let trees = [];
    let enemies = [];
    let particles = [];
    // ক্লাসিক স্পোর্টস কারের আকর্ষণীয় কালার প্যালেট
    const enemyColors = ['#3b82f6', '#ef4444', '#eab308', '#a855f7', '#14b8a6', '#475569'];

    function initEnvironment() {
        trees = [];
        for (let i = 0; i < 12; i++) {
            trees.push({
                x: Math.random() < 0.5 ? Math.random() * 40 + 10 : Math.random() * 40 + 430,
                y: Math.random() * canvas.height,
                size: Math.random() * 12 + 18
            });
        }
    }

    // ট্রাফিক স্পোর্টস কার স্পন
    function spawnEnemy() {
        const lane = Math.floor(Math.random() * laneCount);
        const enemyX = roadX + lane * laneWidth + (laneWidth - 52) / 2;
        
        for (let enemy of enemies) {
            if (Math.abs(enemy.y - (-120)) < 180) return;
        }

        enemies.push({
            x: enemyX,
            y: -120,
            width: 52,
            height: 95,
            speed: Math.random() * 4 + 4,
            color: enemyColors[Math.floor(Math.random() * enemyColors.length)],
            targetX: enemyX,
            moveTimer: Math.random() * 80 + 40
        });
    }

    // ক্লাসিক স্পোর্টস কার (Porsche 911 স্টাইল) রেন্ডার করার ফাংশন
    function drawCar(x, y, width, height, color, angle = 0) {
        ctx.save();
        ctx.translate(x + width / 2, y + height / 2);
        ctx.rotate(angle);

        // গাড়ির ছায়া
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.beginPath();
        ctx.ellipse(0, 4, width / 2 + 6, height / 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // চাকাগুলো (ওয়াইড ফেন্ডার ও টায়ার)
        ctx.fillStyle = '#090d16';
        ctx.fillRect(-width / 2 - 3, -height / 2 + 12, 5, 18);
        ctx.fillRect(width / 2 - 2, -height / 2 + 12, 5, 18);
        ctx.fillRect(-width / 2 - 3, height / 2 - 28, 5, 18);
        ctx.fillRect(width / 2 - 2, height / 2 - 28, 5, 18);

        // গাড়ির মূল বডি (ক্লাসিক স্পোর্টস কার শেপ)
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(-width / 2, -height / 2, width, height, [16, 16, 10, 10]);
        ctx.fill();

        // রিয়ার স্পয়লার (পেছনের উইং / স্পয়লার)
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(-width / 2 + 4, height / 2 - 10, width - 8, 6, 2);
        ctx.fill();

        // ছাদ ও কেবিন অংশ
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.roundRect(-width / 2 + 6, -height / 2 + 22, width - 12, height - 38, 8);
        ctx.fill();

        // সামনের উইন্ডস্ক্রিন গ্লাস
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.beginPath();
        ctx.moveTo(-width / 2 + 8, -height / 2 + 24);
        ctx.lineTo(width / 2 - 8, -height / 2 + 24);
        ctx.lineTo(width / 2 - 10, -height / 2 + 42);
        ctx.lineTo(-width / 2 + 10, -height / 2 + 42);
        ctx.closePath();
        ctx.fill();

        // পেছনের উইন্ডস্ক্রিন গ্লাস
        ctx.beginPath();
        ctx.roundRect(-width / 2 + 8, height / 2 - 32, width - 16, 12, 3);
        ctx.fill();

        // ক্লাসিক রাউন্ড হেডলাইট
        ctx.fillStyle = '#fef08a';
        ctx.shadowColor = '#fef08a';
        ctx.shadowBlur = 6;
        ctx.fillRect(-width / 2 + 6, -height / 2 + 2, 7, 5);
        ctx.fillRect(width / 2 - 13, -height / 2 + 2, 7, 5);
        ctx.shadowBlur = 0;

        // পেছনের টেল লাইট
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(-width / 2 + 5, height / 2 - 4, width - 10, 3);

        ctx.restore();
    }

    // Anime Styled Kawasaki Ninja ZX-10R রেন্ডার করার ফাংশন
    function drawNinjaBike(x, y, width, height, angle = 0) {
        ctx.save();
        ctx.translate(x + width / 2, y + height / 2);
        ctx.rotate(angle);

        // বাইকের ছায়া
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.beginPath();
        ctx.ellipse(0, 5, width / 2 + 6, height / 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // চাকা দুটি
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.roundRect(-width / 2 + 6, -height / 2 + 2, width - 12, 20, 4);
        ctx.roundRect(-width / 2 + 5, height / 2 - 22, width - 10, 22, 4);
        ctx.fill();

        // এক্সহস্ট পাইপ (সিলভার)
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.roundRect(width / 2 - 2, height / 2 - 32, 6, 22, 3);
        ctx.fill();

        // অ্যানিমে স্টাইল উজ্জ্বল লাইম গ্রিন বডি
        ctx.fillStyle = '#4ade80'; 
        ctx.beginPath();
        ctx.roundRect(-width / 2, -height / 2 + 12, width, height - 24, 10);
        ctx.fill();

        // অ্যানিমে স্পেশাল নিয়ন গ্রিন গ্লো ইফেক্ট
        ctx.fillStyle = '#84cc16';
        ctx.beginPath();
        ctx.roundRect(-width / 2 + 2, -height / 2 + 10, width - 4, height - 26, 8);
        ctx.fill();

        // অ্যানিমে ক্যারেক্টার র‍্যাপ স্টাইল (বডির মাঝখানে ডিপ ব্ল্যাক গ্রাফিক্স)
        ctx.fillStyle = '#18181b';
        ctx.beginPath();
        ctx.moveTo(-width / 2 + 2, -height / 2 + 24);
        ctx.lineTo(width / 2 - 2, -height / 2 + 24);
        ctx.lineTo(width / 2 - 4, -height / 2 + 55);
        ctx.lineTo(-width / 2 + 4, -height / 2 + 55);
        ctx.closePath();
        ctx.fill();

        // অ্যানিমে স্টাইল ফায়ার অরেঞ্জ স্ট্রাইপ (Goku Vibe)
        ctx.fillStyle = '#f97316';
        ctx.fillRect(-width / 2 + 2, -height / 2 + 22, 4, 20);
        ctx.fillRect(width / 2 - 6, -height / 2 + 22, 4, 20);

        // ফুয়েল ট্যাংক
        ctx.fillStyle = '#65a30d';
        ctx.beginPath();
        ctx.roundRect(-width / 2 + 4, -height / 2 + 28, width - 8, 22, 6);
        ctx.fill();

        // স্পোর্টস সিট
        ctx.fillStyle = '#090d16';
        ctx.beginPath();
        ctx.roundRect(-width / 2 + 5, height / 2 - 35, width - 10, 18, 4);
        ctx.fill();

        // উইন্ডস্ক্রিন (ডার্ক ভিজর)
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.beginPath();
        ctx.moveTo(-width / 2 + 5, -height / 2 + 12);
        ctx.lineTo(width / 2 - 5, -height / 2 + 12);
        ctx.lineTo(width / 2 - 8, -height / 2 + 26);
        ctx.lineTo(-width / 2 + 8, -height / 2 + 26);
        ctx.closePath();
        ctx.fill();

        // হ্যান্ডেলবার ও মিরর
        ctx.strokeStyle = '#27272a';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(-width / 2 - 5, -height / 2 + 18);
        ctx.lineTo(width / 2 + 5, -height / 2 + 18);
        ctx.stroke();

        ctx.fillStyle = '#18181b';
        ctx.fillRect(-width / 2 - 7, -height / 2 + 14, 5, 3);
        ctx.fillRect(width / 2 + 2, -height / 2 + 14, 5, 3);

        // অ্যানিমে স্টাইল গ্লোয়িং নিয়ন হেডলাইট
        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 12;
        ctx.fillRect(-width / 2 + 6, -height / 2 + 8, 6, 3);
        ctx.fillRect(width / 2 - 12, -height / 2 + 8, 6, 3);
        ctx.shadowBlur = 0;

        // সামনের হেডলাইটের বিম আলো
        const grad = ctx.createLinearGradient(0, -height / 2, 0, -height / 2 - 95);
        grad.addColorStop(0, 'rgba(56, 189, 248, 0.45)');
        grad.addColorStop(1, 'rgba(56, 189, 248, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(-width / 2 + 4, -height / 2 + 6);
        ctx.lineTo(-width / 2 - 16, -height / 2 - 95);
        ctx.lineTo(width / 2 + 16, -height / 2 - 95);
        ctx.lineTo(width / 2 - 4, -height / 2 + 6);
        ctx.fill();

        // ব্রেক লাইট
        if (keys.down) {
            ctx.fillStyle = '#ef4444';
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 15;
        } else {
            ctx.fillStyle = '#991b1b';
        }
        ctx.fillRect(-width / 2 + 7, height / 2 - 10, width - 14, 3);

        ctx.restore();
    }

    function drawBackground() {
        ctx.fillStyle = '#1e5631';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const stripeHeight = 40;
        const totalStripes = Math.ceil(canvas.height / stripeHeight) + 1;
        const offset = roadOffset % (stripeHeight * 2);

        for (let i = -1; i < totalStripes; i++) {
            const y = i * stripeHeight + offset;
            ctx.fillStyle = i % 2 === 0 ? '#ef4444' : '#f8fafc';
            ctx.fillRect(roadX - 10, y, 10, stripeHeight);
            ctx.fillRect(roadX + roadWidth, y, 10, stripeHeight);
        }

        ctx.fillStyle = '#334155';
        ctx.fillRect(roadX, 0, roadWidth, canvas.height);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 4;
        ctx.setLineDash([30, 30]);
        ctx.lineDashOffset = -roadOffset;

        for (let i = 1; i < laneCount; i++) {
            const lineX = roadX + i * laneWidth;
            ctx.beginPath();
            ctx.moveTo(lineX, 0);
            ctx.lineTo(lineX, canvas.height);
            ctx.stroke();
        }
        ctx.setLineDash([]);

        for (let tree of trees) {
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath();
            ctx.arc(tree.x + 5, tree.y + 6, tree.size, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#15803d';
            ctx.beginPath();
            ctx.arc(tree.x, tree.y, tree.size, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.arc(tree.x - 4, tree.y - 4, tree.size * 0.65, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function updateAndDrawParticles() {
        if (player.speed > 2 && Math.random() < 0.6) {
            particles.push({
                x: player.x + player.width / 2 + (Math.random() * 8 - 4),
                y: player.y + player.height,
                size: Math.random() * 3 + 2,
                alpha: 0.6
            });
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.y += player.speed * 0.5 + 2;
            p.size += 0.2;
            p.alpha -= 0.025;

            if (p.alpha <= 0) {
                particles.splice(i, 1);
            } else {
                ctx.fillStyle = `rgba(203, 213, 225, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    function updatePhysics() {
        if (keys.up) {
            player.speed += player.acceleration;
        } else if (keys.down) {
            player.speed -= player.brakePower;
        } else {
            player.speed -= player.friction;
        }

        player.speed = Math.max(2, Math.min(player.speed, player.maxSpeed));

        if (keys.left) {
            player.vx -= player.turnSpeed;
        }
        if (keys.right) {
            player.vx += player.turnSpeed;
        }

        player.vx *= player.turnFriction;
        player.x += player.vx;
        player.angle = player.vx * 0.035;

        if (player.x < roadX + 5) {
            player.x = roadX + 5;
            player.vx = 0;
        }
        if (player.x + player.width > roadX + roadWidth - 5) {
            player.x = roadX + roadWidth - player.width - 5;
            player.vx = 0;
        }

        roadOffset += player.speed;
        score += Math.floor(player.speed * 0.15);

        for (let tree of trees) {
            tree.y += player.speed;
            if (tree.y > canvas.height + 30) {
                tree.y = -30;
                tree.x = Math.random() < 0.5 ? Math.random() * 40 + 10 : Math.random() * 40 + 430;
            }
        }

        if (Math.random() < 0.03) {
            spawnEnemy();
        }

        // ট্রাফিক গাড়ির মুভমেন্ট ও ৩ লাইফ লজিক আপডেট
        for (let i = enemies.length - 1; i >= 0; i--) {
            let enemy = enemies[i];
            
            enemy.y += (player.speed - enemy.speed + 1.5);

            enemy.moveTimer--;
            if (enemy.moveTimer <= 0) {
                const randomLane = Math.floor(Math.random() * laneCount);
                enemy.targetX = roadX + randomLane * laneWidth + (laneWidth - enemy.width) / 2;
                enemy.moveTimer = Math.random() * 90 + 50;
            }

            if (Math.abs(enemy.x - enemy.targetX) > 1) {
                enemy.x += (enemy.targetX > enemy.x) ? 1.8 : -1.8;
            }

            if (
                player.x + 3 < enemy.x + enemy.width - 3 &&
                player.x + player.width - 3 > enemy.x + 3 &&
                player.y + 3 < enemy.y + enemy.height - 3 &&
                player.y + player.height - 3 > enemy.y + 3
            ) {
                lives--; // ১টি লাইফ কমে যাবে
                enemies.splice(i, 1); // ধাক্কা খাওয়া গাড়িটি মুছে যাবে
                livesDisplay.innerText = '❤️'.repeat(Math.max(0, lives));

                if (lives <= 0) {
                    endGame();
                }
            } else if (enemy.y > canvas.height + 150 || enemy.y < -300) {
                enemies.splice(i, 1);
            }
        }

        scoreDisplay.innerText = score;
        speedDisplay.innerText = Math.floor(player.speed * 12);
    }

    function gameLoop() {
        if (!isGameRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawBackground();
        updatePhysics();
        updateAndDrawParticles();

        for (let enemy of enemies) {
            drawCar(enemy.x, enemy.y, enemy.width, enemy.height, enemy.color, 0);
        }

        drawNinjaBike(player.x, player.y, player.width, player.height, player.angle);

        animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');

        player.x = canvas.width / 2 - 16;
        player.y = canvas.height - 100;
        player.speed = 5;
        player.vx = 0;
        player.angle = 0;
        score = 0;
        lives = 3;
        livesDisplay.innerText = '❤️❤️❤️';
        enemies = [];
        particles = [];

        initEnvironment();
        isGameRunning = true;
        gameLoop();
    }

    function endGame() {
        isGameRunning = false;
        cancelAnimationFrame(animationId);
        finalScoreText.innerText = `Your Final Score: ${score}`;
        gameOverScreen.classList.remove('hidden');
    }

    initEnvironment();
    drawBackground();
    drawNinjaBike(player.x, player.y, player.width, player.height, 0);
</script>

</body>
